tests:
  - name: cluster-density-v2-aws
    index: ospst-perf-scale-ci*
    benchmarkIndex: ospst-ripsaw-kube-burner*
    metadata:
      platform: AWS
      masterNodesType: m6a.xlarge
      masterNodesCount: 3
      workerNodesType: m6a.xlarge
      workerNodesCount: 6
      ocpVersion: "4.22"
      benchmark: cluster-density-v2
    metrics:
      - name: apiServerCPU
        metricName: apiServerCPU
        metric_of_interest: value
        agg:
          value: avg
          agg_period: 5m
        direction: 0
      - name: etcdDiskBackendCommitDurationP99
        metricName: 99thEtcdDiskBackendCommitDuration
        metric_of_interest: value
        agg:
          value: avg
          agg_period: 5m
        direction: 0
      - name: etcdDiskWalFsyncDurationP99
        metricName: 99thEtcdDiskWalFsyncDuration
        metric_of_interest: value
        agg:
          value: avg
          agg_period: 5m
        direction: 0
      - name: podReadyLatencyP99
        metricName: podLatency
        metric_of_interest: P99
        agg:
          value: avg
          agg_period: 5m
        direction: 0
